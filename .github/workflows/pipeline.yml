name: pipeline

# Triggered only by cron-job.org, every 3 h via the workflow_dispatch API (token: Actions
# only). The GitHub schedule was removed 1 Nov to stay inside MotherDuck Lite's 10 h a month
# of compute; it was also unreliable (gaps a median of 4.4 h at every 2 h, 16-18 Oct). Each run:
# extract + load (incremental, with forecast snapshots) into MotherDuck,
# check source freshness, rebuild and test the dbt models, and publish dbt docs to Pages.
on:
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read  # the job holding MOTHERDUCK_TOKEN gets nothing more

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_TARGET: motherduck
      DBT_TARGET: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dbt,ml]"

      - name: Extract + load
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: gridcarbon incremental

      - name: Source freshness
        working-directory: dbt
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: dbt source freshness --profiles-dir .

      - name: Transform + test
        working-directory: dbt
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: dbt build --profiles-dir .

      - name: Forecast next 48h
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: gridcarbon predict

      - name: Score forecasts (model vs NESO)
        working-directory: dbt
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: dbt run --profiles-dir . --select fct_model_vs_official

      - name: Build docs site
        working-directory: dbt
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          dbt docs generate --profiles-dir .
          mkdir -p ../site && cp target/index.html target/manifest.json target/catalog.json ../site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  docs:
    needs: run
    runs-on: ubuntu-latest
    permissions:  # only the deploy job may publish to Pages
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # An optional dataset (NESO) that is skipped in each of the last 3 runs is a layout change, not a
  # blip: turn the run red so GitHub emails the owner. Needs its own token use, hence its own job.
  health:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_TARGET: motherduck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Repeated optional-dataset failures
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: gridcarbon check-warnings --runs 3
