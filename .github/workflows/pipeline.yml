name: pipeline

# Hourly. GitHub delays and skips many scheduled runs (at every 2 h, gaps were a median of
# 4.4 h over 16-18 Oct), so ask hourly to get closer to every 2 h. Each run:
# extract + load (incremental, with forecast snapshots) into MotherDuck,
# check source freshness, rebuild and test the dbt models, and publish dbt docs to Pages.
# GitHub disables schedules in public repos after 60 days without commits: re-enable from
# the Actions tab if that happens.
on:
  schedule:
    - cron: "17 * * * *"  # :17 avoids the busy top of the hour; start times can lag
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read  # the job holding MOTHERDUCK_TOKEN gets nothing more

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_TARGET: motherduck
      DBT_TARGET: prod
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dbt,ml]"

      - name: Extract + load
        run: gridcarbon incremental

      - name: Source freshness
        working-directory: dbt
        run: dbt source freshness --profiles-dir .

      - name: Transform + test
        working-directory: dbt
        run: dbt build --profiles-dir .

      - name: Forecast next 48h
        run: gridcarbon predict

      - name: Score forecasts (model vs NESO)
        working-directory: dbt
        run: dbt run --profiles-dir . --select fct_model_vs_official

      - name: Build docs site
        working-directory: dbt
        run: |
          dbt docs generate --profiles-dir .
          mkdir -p ../site && cp target/index.html target/manifest.json target/catalog.json ../site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  docs:
    needs: run
    runs-on: ubuntu-latest
    permissions:  # only the deploy job may publish to Pages
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
