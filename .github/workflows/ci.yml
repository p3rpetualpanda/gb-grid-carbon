name: CI

# Lint + offline unit tests on every push / PR. Tests use recorded API fixtures and an
# in-memory DuckDB, so CI never calls the live APIs or touches the production warehouse.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dbt,ml]"

      - name: Lint
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts

      - name: Test
        run: python -m pytest

      # Compiles and runs every dbt model + test against an empty local warehouse.
      - name: dbt build (empty warehouse)
        run: |
          gridcarbon init-db
          cd dbt && dbt build --profiles-dir .
