version: 2

sources:
  - name: raw
    description: Raw API data loaded by the Python pipeline (src/gridcarbon). See docs/data_dictionary.md.
    schema: raw
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 6, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: intensity_national
        description: National half-hourly forecast + actual carbon intensity (gCO2/kWh).
      - name: generation_mix
        description: National generation mix, one row per half-hour per fuel.
      - name: intensity_regional
        description: Regional forecast intensity; regions 15-18 are aggregates.
      - name: official_forecast_snapshots
        description: NESO 48h forecast as captured at each pipeline run (issued_at).
      # Unchanged rows aren't rewritten, so freshness = new data; these archives update ~daily.
      - name: weather_observed
        description: Hourly observed weather at fixed GB points (Open-Meteo archive).
        config:
          freshness:
            warn_after: {count: 30, period: hour}
            error_after: {count: 72, period: hour}
      - name: weather_historical_forecast
        description: Hourly weather forecasts as issued (for leakage-safe model training).
        config:
          freshness:
            warn_after: {count: 30, period: hour}
            error_after: {count: 72, period: hour}
      - name: weather_forecast_snapshots
        description: Live weather forecast captured at each pipeline run.
      - name: neso_wind_forecast
        description: NESO day-ahead wind forecast (transmission wind farms), every vintage.
        config:
          freshness:
            warn_after: {count: 30, period: hour}
            error_after: {count: 72, period: hour}
      - name: neso_wind_14d_snapshots
        description: NESO 14-day transmission wind forecast as captured at each pipeline run.
      - name: neso_embedded_forecast
        description: NESO embedded (local network) wind and solar forecasts, every vintage.

  - name: ml
    description: Model outputs written by `gridcarbon predict` (src/gridcarbon/forecast.py).
    schema: ml
    tables:
      - name: model_forecasts
        description: Our 48h forecast per pipeline run (issued_at, period_from, lead 1-96).
